# ---------- Server ----------
server.port=${PORT:8080}
server.address=0.0.0.0
# Trust X-Forwarded-* headers from the hosting platform's proxy (https, real client IP)
server.forward-headers-strategy=framework

# Players stay signed in for 30 days
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ---------- Database ----------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- Time ----------
app.zone=Asia/Jerusalem
spring.jackson.time-zone=Asia/Jerusalem

# ---------- App ----------
# Public link of the site, included in SMS messages
app.public-url=${APP_URL:}

# ---------- SMS (Twilio) ----------
# If TWILIO_ACCOUNT_SID is empty, messages are only written to the log (handy for local testing).
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
# Either a Twilio phone number (+1...) or an alphanumeric sender name (e.g. NasserFC)
twilio.from=${TWILIO_FROM:}
# Optional: use a Messaging Service instead of "from" (starts with MG...)
twilio.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:}

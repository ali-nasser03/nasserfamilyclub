# ---------- Server ----------
server.port=${PORT:8080}
server.address=0.0.0.0
# Trust X-Forwarded-* headers from the hosting platform's proxy (https, real client IP)
server.forward-headers-strategy=framework

# Browsers must check with the server before reusing a saved page/script,
# so phones (Safari) always get the latest version after a deploy
spring.web.resources.cache.cachecontrol.no-cache=true

# ---------- Database ----------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- Time ----------
app.zone=Asia/Jerusalem
spring.jackson.time-zone=Asia/Jerusalem

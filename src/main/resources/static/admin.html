<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#161616">
    <title>الإدارة - نادي عائلة ناصر</title>
    <link rel="icon" href="logo.jpg">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <img src="logo.jpg" alt="">
        <div class="who">
            <strong>لوحة الإدارة</strong>
            <span>نادي عائلة ناصر</span>
        </div>
        <button class="link-btn" onclick="logout()">خروج</button>
    </div>
</header>

<main class="wrap wide">
    <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-match" aria-controls="view-match">المباراة</button>
        <button class="tab" role="tab" id="tab-pay" aria-controls="view-pay">الاشتراكات</button>
        <button class="tab" role="tab" id="tab-players" aria-controls="view-players">اللاعبين</button>
    </div>

    <!-- ===================== Match ===================== -->
    <section id="view-match" role="tabpanel" aria-labelledby="tab-match">
        <div id="match"></div>

        <div id="currentTools" hidden>
            <section class="panel">
                <div id="tally"></div>
                <div class="actions">
                    <a class="btn wa" id="waMatch" target="_blank" rel="noopener">شارك المباراة على الواتساب</a>
                    <a class="btn wa-ghost" id="waRemind" target="_blank" rel="noopener">ذكّر اللي ما صوّتوا</a>
                    <a class="btn wa-ghost" id="waComing" target="_blank" rel="noopener">شارك قائمة الجايين</a>
                </div>
                <div class="actions">
                    <button class="btn danger" id="closeBtn">سكّر التصويت</button>
                </div>
                <div id="voteList"></div>
            </section>
        </div>

        <form class="panel" id="matchForm" novalidate>
            <h2 id="matchFormTitle">نشر مباراة جديدة</h2>
            <label class="field">
                <span>المكان</span>
                <input class="input" id="mLocation" maxlength="200" required>
            </label>
            <label class="field">
                <span>الموعد</span>
                <input class="input" id="mDate" type="datetime-local" required>
            </label>
            <label class="field">
                <span>ملاحظة (اختياري)</span>
                <textarea class="input" id="mNote" maxlength="1000" placeholder="مثلاً: كل واحد يجيب مي"></textarea>
            </label>
            <button class="btn block" type="submit" id="publishBtn">نشر المباراة</button>
        </form>
    </section>

    <!-- ===================== Payments ===================== -->
    <section id="view-pay" role="tabpanel" aria-labelledby="tab-pay" hidden>
        <section class="panel">
            <div class="panel-head">
                <h2>اشتراك الشهر</h2>
                <input class="input" type="month" id="month" style="max-width:190px;min-height:42px">
            </div>
            <p class="muted" style="margin:0" id="payStats"></p>
            <ul class="list" id="payList" style="margin-top:8px"></ul>
        </section>
    </section>

    <!-- ===================== Players ===================== -->
    <section id="view-players" role="tabpanel" aria-labelledby="tab-players" hidden>
        <section class="panel">
            <div class="panel-head">
                <h2>اللاعبين <span class="muted" id="playerCount"></span></h2>
            </div>
            <input class="input" id="search" type="search" placeholder="ابحث بالاسم">
            <div id="playerList" style="margin-top:8px"></div>
        </section>
    </section>
</main>

<script src="js/app.js"></script>
<script>
    let overview = null;
    let selectedMonth = '';
    let openEditor = null;

    // ---------------------------------------------------------------- tabs
    const TABS = ['match', 'pay', 'players'];

    function showTab(name) {
        TABS.forEach(t => {
            document.getElementById('tab-' + t).setAttribute('aria-selected', t === name);
            document.getElementById('view-' + t).hidden = t !== name;
        });
        storageSet('adminTab', name);
    }

    TABS.forEach(t => document.getElementById('tab-' + t).onclick = () => showTab(t));
    showTab(TABS.includes(storageGet('adminTab')) ? storageGet('adminTab') : 'match');

    // ---------------------------------------------------------------- data
    async function load() {
        try {
            const q = selectedMonth ? '?month=' + encodeURIComponent(selectedMonth) : '';
            overview = await api('GET', '/api/admin/overview' + q);
            selectedMonth = overview.month;
            render();
        } catch (err) {
            if (err.status === 403) {
                location.replace('player.html');
                return;
            }
            toast(err.message, 'error');
        }
    }

    function render() {
        renderMatch();
        renderPayments();
        renderPlayers();
    }

    // ---------------------------------------------------------------- match tab
    function renderMatch() {
        const match = overview.match;
        document.getElementById('match').innerHTML = shieldHtml(match, 'انشر مباراة من تحت');
        document.getElementById('currentTools').hidden = !match;
        document.getElementById('matchFormTitle').textContent = match ? 'نشر مباراة بدل الحالية' : 'نشر مباراة جديدة';

        if (match) {
            const g = groupVotes(overview.players);
            document.getElementById('tally').innerHTML = tallyHtml(g);
            document.getElementById('voteList').innerHTML = voteListHtml(g, null);
            setLink('waMatch', newMatchText(match), true);
            setLink('waRemind', reminderText(match, g.wait), g.wait.length > 0);
            setLink('waComing', comingText(match, g.yes), g.yes.length > 0);
        }
    }

    // ---------------------------------------------------------------- WhatsApp sharing
    // Opens WhatsApp with the message ready; the admin picks the family group and sends.
    const SITE_URL = location.origin + '/';

    function whatsappUrl(text) {
        return 'https://wa.me/?text=' + encodeURIComponent(text);
    }

    function setLink(id, text, enabled) {
        const a = document.getElementById(id);
        a.href = whatsappUrl(text);
        a.toggleAttribute('aria-disabled', !enabled);
        a.tabIndex = enabled ? 0 : -1;
    }

    function whenText(match) {
        return `${matchDay(match.dateTime)} الساعة ${matchTime(match.dateTime)}`;
    }

    function newMatchText(match) {
        return [
            '⚽🔥 تم حجز الملعب 🔥⚽',
            '',
            `📅 يوم ${matchDay(match.dateTime)}`,
            `⏰ الساعة ${matchTime(match.dateTime)}`,
            `📍 ${match.location}`,
            match.note ? `📝 ${match.note}` : null,
            '',
            '🗳️ الكل يصوّت 👇',
            SITE_URL,
            '',
            '💪 يلا يا شباب! 🏆',
        ].filter(line => line !== null).join('\n');
    }

    function reminderText(match, waiting) {
        return [
            `⏰ تذكير: مباراة ${whenText(match)}`,
            '',
            'لسا ما صوّتوا:',
            ...waiting.map(p => `• ${p.name}`),
            '',
            'صوّتوا هون 👇',
            SITE_URL,
        ].join('\n');
    }

    function comingText(match, coming) {
        return [
            `✅ الجايين لمباراة ${whenText(match)} (${coming.length})`,
            `📍 ${match.location}`,
            '',
            ...coming.map((p, i) => `${i + 1}. ${p.name}`),
        ].join('\n');
    }

    /** After publishing: one tap to send the match to the family group. */
    function shareAfterPublish(match) {
        const dlg = document.createElement('dialog');
        dlg.innerHTML = `
            <h3>نشرنا المباراة</h3>
            <p>ابعتها لغروب العيلة على الواتساب عشان الكل يعرف ويصوّت.</p>
            <div class="actions">
                <a class="btn wa" target="_blank" rel="noopener" href="${esc(whatsappUrl(newMatchText(match)))}">ابعت على الواتساب</a>
                <button class="btn ghost" value="close">بعدين</button>
            </div>`;
        document.body.appendChild(dlg);
        dlg.addEventListener('click', e => {
            if (e.target.closest('a, button')) dlg.close();
        });
        dlg.addEventListener('close', () => dlg.remove());
        dlg.showModal();
    }

    function setMinDate() {
        const d = new Date(Date.now() + 5 * 60000);
        const pad = n => String(n).padStart(2, '0');
        document.getElementById('mDate').min =
            `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    setMinDate();

    document.getElementById('matchForm').addEventListener('submit', async e => {
        e.preventDefault();
        const body = {
            location: document.getElementById('mLocation').value.trim(),
            dateTime: document.getElementById('mDate').value,
            note: document.getElementById('mNote').value.trim(),
        };
        if (!body.location) return toast('اكتب مكان المباراة', 'error');
        if (!body.dateTime) return toast('اختار موعد المباراة', 'error');

        const replacing = overview?.match
            ? ' المباراة الحالية رح تتسكّر وتصويتها بضل محفوظ.'
            : '';
        if (!await confirmBox('نشر المباراة', `${body.location}، ${matchDay(body.dateTime)} الساعة ${matchTime(body.dateTime)}.${replacing}`, 'نشر المباراة')) return;

        const btn = document.getElementById('publishBtn');
        btn.disabled = true;
        try {
            await api('POST', '/api/admin/matches', body);
            e.target.reset();
            await load();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if (overview.match) shareAfterPublish(overview.match);
        } catch (err) {
            toast(err.message, 'error');
        } finally {
            btn.disabled = false;
        }
    });

    document.getElementById('closeBtn').onclick = async () => {
        if (!await confirmBox('سكّر التصويت', 'اللاعبين ما رح يقدروا يصوّتوا بعد هيك. التصويت الحالي بضل محفوظ.', 'سكّر التصويت', true)) return;
        try {
            await api('DELETE', '/api/admin/matches/current');
            toast('سكّرنا التصويت');
            load();
        } catch (err) {
            toast(err.message, 'error');
        }
    };

    // ---------------------------------------------------------------- payments tab
    const monthInput = document.getElementById('month');
    monthInput.addEventListener('change', () => {
        if (monthInput.value) {
            selectedMonth = monthInput.value;
            load();
        }
    });

    function renderPayments() {
        monthInput.value = overview.month;
        const players = [...overview.players].sort((a, b) =>
            (a.payment === 'EXEMPT') - (b.payment === 'EXEMPT') || byName(a, b));

        const paid = players.filter(p => p.payment === 'PAID').length;
        const payers = players.filter(p => p.payment !== 'EXEMPT').length;
        const exempt = players.length - payers;
        document.getElementById('payStats').textContent =
            `${monthName(overview.month)}: دفع ${paid} من ${payers}` + (exempt ? `، و${exempt} معفيين` : '');

        document.getElementById('payList').innerHTML = players.length ? players.map(p => `
            <li>
                <span class="name">${esc(p.name)}</span>
                ${p.payment === 'EXEMPT'
                    ? '<span class="pill exempt">معفي</span>'
                    : `<label class="switch">
                           <span class="muted">${p.payment === 'PAID' ? 'دافع' : 'مش دافع'}</span>
                           <input type="checkbox" data-pay="${p.id}" ${p.payment === 'PAID' ? 'checked' : ''}
                                  aria-label="${esc(p.name)} دفع">
                           <span class="track"></span>
                       </label>`}
            </li>`).join('') : '<li class="muted">ما في لاعبين لسا</li>';
    }

    document.getElementById('payList').addEventListener('change', async e => {
        const box = e.target.closest('[data-pay]');
        if (!box) return;
        box.disabled = true;
        try {
            await api('PUT', `/api/admin/players/${box.dataset.pay}/payment`, { month: selectedMonth, paid: box.checked });
            const p = overview.players.find(x => x.id === Number(box.dataset.pay));
            if (p) p.payment = box.checked ? 'PAID' : 'UNPAID';
            renderPayments();
        } catch (err) {
            box.checked = !box.checked;
            box.disabled = false;
            toast(err.message, 'error');
        }
    });

    // ---------------------------------------------------------------- players tab
    const searchInput = document.getElementById('search');
    searchInput.addEventListener('input', renderPlayers);

    function renderPlayers() {
        const all = [...overview.players].sort(byName);
        document.getElementById('playerCount').textContent = `(${all.length})`;

        const q = searchInput.value.trim();
        const list = q ? all.filter(p => p.name.includes(q)) : all;

        document.getElementById('playerList').innerHTML = list.length ? list.map(p => `
            <div class="player-row ${openEditor === p.id ? 'open' : ''}">
                <button type="button" data-open="${p.id}" aria-expanded="${openEditor === p.id}">
                    <span class="name">${esc(p.name)}</span>
                    ${p.working ? '' : '<span class="pill exempt">معفي</span>'}
                </button>
                ${openEditor === p.id ? editorHtml(p) : ''}
            </div>`).join('') : '<p class="muted">ما في نتائج</p>';
    }

    function editorHtml(p) {
        return `
            <form data-edit="${p.id}" novalidate>
                <label class="field"><span>الاسم</span>
                    <input class="input" name="fullName" value="${esc(p.name)}" maxlength="80" required></label>
                <label class="field"><span>العمر</span>
                    <input class="input" name="age" type="number" min="5" max="99" value="${p.age || ''}"></label>
                <label class="check"><input type="checkbox" name="working" ${p.working ? 'checked' : ''}>
                    <span>بشتغل <small>شيلها إذا اللاعب معفي من الاشتراك</small></span></label>
                <div class="actions">
                    <button class="btn" type="submit">حفظ التعديلات</button>
                    <button class="btn danger" type="button" data-delete="${p.id}">حذف اللاعب</button>
                </div>
            </form>`;
    }

    const playerList = document.getElementById('playerList');

    playerList.addEventListener('click', async e => {
        const openBtn = e.target.closest('[data-open]');
        if (openBtn) {
            const id = Number(openBtn.dataset.open);
            openEditor = openEditor === id ? null : id;
            renderPlayers();
            return;
        }

        const delBtn = e.target.closest('[data-delete]');
        if (delBtn) {
            const p = overview.players.find(x => x.id === Number(delBtn.dataset.delete));
            if (!await confirmBox('حذف لاعب', `رح ينحذف ${p.name} مع كل تصويتاته واشتراكاته. ما في رجعة.`, 'حذف اللاعب', true)) return;
            try {
                await api('DELETE', `/api/admin/players/${p.id}`);
                openEditor = null;
                toast('حذفنا اللاعب');
                load();
            } catch (err) {
                toast(err.message, 'error');
            }
        }
    });

    playerList.addEventListener('submit', async e => {
        e.preventDefault();
        const form = e.target;
        const id = Number(form.dataset.edit);
        const body = {
            fullName: form.fullName.value.trim(),
            age: parseInt(form.age.value, 10) || 0,
            working: form.working.checked,
        };
        if (!body.fullName) return toast('الاسم مطلوب', 'error');
        try {
            await api('PUT', `/api/admin/players/${id}`, body);
            openEditor = null;
            toast('حفظنا التعديلات', 'ok');
            load();
        } catch (err) {
            toast(err.message, 'error');
        }
    });

    load();
    setInterval(() => { if (!document.hidden && openEditor === null) load(); }, 30000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#161616">
    <title>نادي عائلة ناصر</title>
    <link rel="icon" href="logo.jpg">
    <link rel="stylesheet" href="css/app.css?v=3">
</head>
<body>

<main class="auth">
    <div class="auth-card">
        <img class="crest" src="logo.jpg" alt="شعار عائلة محمود ناصر">
        <h1>نادي عائلة ناصر</h1>

        <!-- Sign in -->
        <form id="loginForm" class="panel" novalidate>
            <label class="field">
                <span>اسمك الثلاثي</span>
                <input class="input" id="loginName" autocomplete="name" required>
                <small>نفس الاسم اللي سجّلت فيه</small>
            </label>

            <label class="field" id="passwordField" hidden>
                <span>كلمة سر الإدارة</span>
                <input class="input" id="loginPassword" type="password" autocomplete="current-password">
            </label>

            <button class="btn block" type="submit" id="loginBtn">دخول</button>

            <p class="center" style="margin:14px 0 0">
                أول مرة؟
                <button type="button" class="link-btn" id="showRegister">سجّل كلاعب جديد</button>
            </p>
        </form>

        <!-- Register -->
        <form id="registerForm" class="panel" novalidate hidden>
            <h2>تسجيل لاعب جديد</h2>

            <label class="field">
                <span>الاسم الثلاثي</span>
                <input class="input" id="regName" autocomplete="name" required maxlength="80">
            </label>

            <label class="field">
                <span>العمر</span>
                <input class="input" id="regAge" type="number" inputmode="numeric" min="5" max="99" required>
            </label>

            <label class="check">
                <input type="checkbox" id="regWorking" checked>
                <span>بشتغل
                    <small>اللي بشتغل بدفع الاشتراك الشهري، الطلاب معفيين</small>
                </span>
            </label>

            <button class="btn block" type="submit" id="registerBtn">سجّلني</button>

            <p class="center" style="margin:14px 0 0">
                <button type="button" class="link-btn" id="showLogin">عندي حساب، بدي أدخل</button>
            </p>
        </form>
    </div>
</main>

<script src="js/app.js?v=3"></script>
<script>
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const passwordField = document.getElementById('passwordField');

    function goHome(me) {
        if (me.token) setToken(me.token);
        goTo(me.role === 'ADMIN' ? 'admin.html' : 'player.html');
    }

    // Already signed in? Skip the form. Not when we were just sent here because the session ended.
    if (getToken() && !new URLSearchParams(location.search).has('out')) {
        api('GET', '/api/auth/me', undefined, { allow401: true }).then(goHome).catch(() => {});
    }

    document.getElementById('showRegister').onclick = () => {
        loginForm.hidden = true;
        registerForm.hidden = false;
        document.getElementById('regName').value = document.getElementById('loginName').value;
        document.getElementById('regName').focus();
    };

    document.getElementById('showLogin').onclick = () => {
        registerForm.hidden = true;
        loginForm.hidden = false;
        document.getElementById('loginName').focus();
    };

    // Typing a different name hides the admin password field again
    document.getElementById('loginName').addEventListener('input', () => {
        passwordField.hidden = true;
        document.getElementById('loginPassword').value = '';
    });

    loginForm.addEventListener('submit', async e => {
        e.preventDefault();
        const name = document.getElementById('loginName').value.trim();
        const password = document.getElementById('loginPassword').value;
        if (!name) {
            toast('اكتب اسمك', 'error');
            return;
        }

        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        try {
            const me = await api('POST', '/api/auth/login', { name, password }, { allow401: true });
            goHome(me);
        } catch (err) {
            if (err.code === 'PASSWORD_REQUIRED') {
                passwordField.hidden = false;
                document.getElementById('loginPassword').focus();
            } else {
                toast(err.message, 'error');
            }
        } finally {
            btn.disabled = false;
        }
    });

    registerForm.addEventListener('submit', async e => {
        e.preventDefault();
        const body = {
            fullName: document.getElementById('regName').value.trim(),
            age: parseInt(document.getElementById('regAge').value, 10) || 0,
            working: document.getElementById('regWorking').checked,
        };

        if (!body.fullName) return toast('اكتب اسمك الثلاثي', 'error');
        if (body.age < 5 || body.age > 99) return toast('اكتب عمرك', 'error');

        const btn = document.getElementById('registerBtn');
        btn.disabled = true;
        try {
            const me = await api('POST', '/api/auth/register', body, { allow401: true });
            goHome(me);
        } catch (err) {
            toast(err.message, 'error');
        } finally {
            btn.disabled = false;
        }
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#161616">
    <title>المباراة - نادي عائلة ناصر</title>
    <link rel="icon" href="logo.jpg">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <img src="logo.jpg" alt="">
        <div class="who">
            <strong id="meName">...</strong>
            <span>نادي عائلة ناصر</span>
        </div>
        <button class="link-btn" onclick="logout()">خروج</button>
    </div>
</header>

<main class="wrap">
    <div id="match"></div>

    <div class="vote-row">
        <button class="vote-btn yes" id="yesBtn" aria-pressed="false" disabled>سأحضر</button>
        <button class="vote-btn no" id="noBtn" aria-pressed="false" disabled>معتذر</button>
    </div>

    <div class="my-line">
        <span id="myVote" class="muted"></span>
        <button class="link-btn" id="clearBtn" hidden>إلغاء تصويتي</button>
    </div>

    <section class="panel">
        <div class="panel-head">
            <h2>اشتراك <span id="monthName"></span></h2>
            <span id="myPayment"></span>
        </div>
    </section>

    <section class="panel" id="boardPanel">
        <h2>مين جاي؟</h2>
        <div id="tally"></div>
        <div id="list"></div>
    </section>
</main>

<audio id="yesSound" src="yes.wav" preload="auto"></audio>

<script src="js/app.js"></script>
<script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const clearBtn = document.getElementById('clearBtn');
    let busy = false;

    function render(board) {
        const me = board.me;
        const open = !!board.match;

        document.getElementById('meName').textContent = me.name;
        document.getElementById('match').innerHTML =
            shieldHtml(board.match, 'لما تنزل مباراة جديدة بيوصل الخبر على غروب العيلة');

        yesBtn.disabled = noBtn.disabled = !open || busy;
        yesBtn.setAttribute('aria-pressed', me.vote === 'YES');
        noBtn.setAttribute('aria-pressed', me.vote === 'NO');

        const myVote = document.getElementById('myVote');
        if (!open) {
            myVote.textContent = '';
        } else if (me.vote) {
            myVote.innerHTML = `تصويتك: <b>${VOTE_LABEL[me.vote]}</b>`;
        } else {
            myVote.textContent = 'لسا ما صوّتت';
        }
        clearBtn.hidden = !open || !me.vote;

        document.getElementById('monthName').textContent = monthName(board.month);
        const payClass = { PAID: 'paid', UNPAID: 'unpaid', EXEMPT: 'exempt' }[me.payment];
        document.getElementById('myPayment').innerHTML =
            `<span class="pill ${payClass}">${PAYMENT_LABEL[me.payment]}</span>`;

        const boardPanel = document.getElementById('boardPanel');
        boardPanel.hidden = !open;
        if (open) {
            const g = groupVotes(board.players);
            document.getElementById('tally').innerHTML = tallyHtml(g);
            document.getElementById('list').innerHTML = voteListHtml(g, me.id);
        }
    }

    async function load() {
        try {
            render(await api('GET', '/api/board'));
        } catch (err) {
            toast(err.message, 'error');
        }
    }

    async function vote(value) {
        if (busy) return;
        busy = true;
        yesBtn.disabled = noBtn.disabled = true;
        try {
            const board = await api('PUT', '/api/vote', { vote: value });
            busy = false;
            render(board);
            if (value === 'YES') {
                toast('تمام، سجّلناك جاي', 'ok');
                const s = document.getElementById('yesSound');
                s.currentTime = 0;
                s.play().catch(() => {});
                if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
            } else {
                toast('سجّلنا اعتذارك');
            }
        } catch (err) {
            busy = false;
            toast(err.message, 'error');
            load();
        }
    }

    yesBtn.onclick = () => vote('YES');
    noBtn.onclick = () => vote('NO');

    clearBtn.onclick = async () => {
        if (!await confirmBox('إلغاء التصويت', 'بدك تلغي تصويتك على هاي المباراة؟', 'إلغاء التصويت')) return;
        try {
            render(await api('DELETE', '/api/vote'));
            toast('ألغينا تصويتك');
        } catch (err) {
            toast(err.message, 'error');
        }
    };

    load();
    // Keep the list fresh while the page is open
    setInterval(() => { if (!document.hidden) load(); }, 30000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
